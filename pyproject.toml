[build-system]
requires = [
    "setuptools>=77.0",
    "torch>=2.3.1",
]
build-backend = "setuptools.build_meta"

[project]
name = "streamsam"
version = "1.0"
description = "Bounded streaming video segmentation built on SAM 2 and EdgeTAM"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Meta AI", email = "chongzhou1024@gmail.com" },
]
maintainers = [
    { name = "streamSAM contributors" },
]
dependencies = [
    "hydra-core>=1.3.2",
    "iopath>=0.1.10",
    "numpy>=1.24.4",
    "opencv-python>=4.7.0",
    "pillow>=9.4.0",
    "torch>=2.3.1",
    "torchvision>=0.18.1",
    "tqdm>=4.66.1",
]

[project.urls]
Repository = "https://github.com/dej-h/streamSAM"
Upstream = "https://github.com/facebookresearch/EdgeTAM"
"SAM 2" = "https://github.com/facebookresearch/sam2"

[project.optional-dependencies]
notebooks = [
    "eva-decord>=0.6.1",
    "jupyter>=1.0.0",
    "matplotlib>=3.9.1",
    "opencv-python>=4.7.0",
]
dev = [
    "black==24.2.0",
    "fvcore>=0.1.5.post20221221",
    "opencv-python>=4.7.0",
    "pandas>=2.2.2",
    "pycocotools>=2.0.8",
    "scikit-image>=0.24.0",
    "submitit>=1.5.1",
    "tensorboard>=2.17.0",
    "tensordict>=0.5.0",
    "ufmt==2.0.0b2",
    "usort==1.0.2",
]
gradio = [
    "eva-decord==0.6.1",
    "gradio==4.44.0",
    "gradio_client==1.3.0",
    "gradio_image_prompter==0.1.0",
    "moviepy==1.0.3",
    "opencv-python==4.10.0.84",
    "pydantic==2.10.6",
    "timm==1.0.15",
]
coreml = [
    "coremltools>=8.0.0",
    "pillow>=9.4.0",
    "timm==1.0.15",
]

[dependency-groups]
benchmark = [
    "eva-decord>=0.6.1",
    "nvidia-ml-py>=13.610.43",
    "opencv-python>=4.7.0",
    "timm==1.0.15",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
exclude = ["notebooks*"]
